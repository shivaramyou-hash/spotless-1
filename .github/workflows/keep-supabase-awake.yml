name: Keep Supabase Awake

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          # Use curl to query a table. This keeps the database from pausing.
          # We use the REST API endpoint for the contact_form table.
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/contact_form?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
