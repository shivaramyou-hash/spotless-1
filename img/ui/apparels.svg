<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d9bff"/>
      <stop offset="1" stop-color="#3a63c9"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14204a" flood-opacity=".35"/>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="40"/></filter>
    <!-- Polo shirt outline, hung from (300,230) -->
    <path id="polo" d="M255 230 L190 252 L118 322 L162 384 L200 356 L200 640 Q300 658 400 640 L400 356 L438 384 L482 322 L410 252 L345 230 Q300 268 255 230 Z"/>
    <g id="hanger" fill="none" stroke="#e9edf5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 214 L208 252 M300 214 L392 252"/>
      <path d="M300 214 V196 a16 16 0 1 0 -16 -16"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="520" cy="120" r="150" fill="#ffc169" opacity=".45" filter="url(#blur)"/>
  <circle cx="60" cy="560" r="170" fill="#8fd3e8" opacity=".45" filter="url(#blur)"/>
  <g fill="#fff" opacity=".12">
    <circle cx="70" cy="90" r="3"/><circle cx="110" cy="90" r="3"/><circle cx="150" cy="90" r="3"/>
    <circle cx="70" cy="130" r="3"/><circle cx="110" cy="130" r="3"/><circle cx="150" cy="130" r="3"/>
    <circle cx="70" cy="170" r="3"/><circle cx="110" cy="170" r="3"/><circle cx="150" cy="170" r="3"/>
  </g>

  <!-- Clothes rail -->
  <rect x="40" y="152" width="520" height="10" rx="5" fill="#e9edf5" opacity=".9"/>

  <!-- Back garment: yellow polo -->
  <g transform="translate(118 8) scale(.86)" opacity=".95" filter="url(#soft)">
    <use xlink:href="#hanger" transform="translate(0 -8)"/>
    <use xlink:href="#polo" fill="#ffc169"/>
    <use xlink:href="#polo" fill="url(#shade)"/>
    <path d="M255 230 L300 274 L345 230 L332 221 L300 252 L268 221 Z" fill="#323842"/>
  </g>

  <!-- Middle garment: hi-vis style vest -->
  <g transform="translate(-112 18) scale(.82)" filter="url(#soft)">
    <use xlink:href="#hanger" transform="translate(0 -8)"/>
    <path d="M250 232 L212 260 L212 640 Q300 656 388 640 L388 260 L350 232 Q340 330 300 350 Q260 330 250 232 Z" fill="#c9ef4a"/>
    <path d="M250 232 L212 260 L212 640 Q300 656 388 640 L388 260 L350 232 Q340 330 300 350 Q260 330 250 232 Z" fill="url(#shade)"/>
    <rect x="212" y="470" width="176" height="22" fill="#e6e9ee"/>
    <rect x="212" y="540" width="176" height="22" fill="#e6e9ee"/>
    <rect x="296" y="350" width="8" height="294" fill="#9fbf2c"/>
  </g>

  <!-- Front garment: navy branded polo -->
  <g filter="url(#soft)">
    <use xlink:href="#hanger"/>
    <use xlink:href="#polo" fill="#323842"/>
    <use xlink:href="#polo" fill="url(#shade)"/>
    <!-- collar with yellow trim -->
    <path d="M255 230 L300 276 L345 230 L332 220 L300 254 L268 220 Z" fill="#2a2f38"/>
    <path d="M268 220 L300 254 L332 220" fill="none" stroke="#ffc169" stroke-width="5" stroke-linejoin="round"/>
    <!-- sleeve trims -->
    <path d="M118 322 L162 384" stroke="#ffc169" stroke-width="6" stroke-linecap="round"/>
    <path d="M482 322 L438 384" stroke="#ffc169" stroke-width="6" stroke-linecap="round"/>
    <!-- placket -->
    <rect x="292" y="262" width="16" height="78" rx="3" fill="#2a2f38"/>
    <circle cx="300" cy="284" r="4" fill="#e9edf5"/>
    <circle cx="300" cy="310" r="4" fill="#e9edf5"/>
    <!-- chest logo (Spotless mark) -->
    <circle cx="362" cy="318" r="20" fill="none" stroke="#5a8cf5" stroke-width="7"/>
    <circle cx="362" cy="318" r="7" fill="#fff"/>
    <!-- seam hint -->
    <path d="M200 612 Q300 630 400 612" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  </g>
</svg>
